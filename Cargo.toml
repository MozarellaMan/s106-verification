[package]
name = "s106"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
image = "0.25.10"
oar-ocr = "0.10.0"
pdfium-render = "0.9.4"
regex = "1.13.1"
rust-claude-sdk = "=0.2.0"
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["rt"] }

winnow = "=1.0.4"

[dev-dependencies]
tempfile = "3.27.0"
