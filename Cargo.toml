[package]
name = "s106"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.10"
image = "0.25.10"
# ONNX Runtime is loaded at run time from models/onnxruntime (scripts/fetch-models.sh), like
# PDFium, so building and the default tests need neither the runtime nor a network download.
oar-ocr = { version = "0.10.0", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
pdfium-render = "0.9.4"
regex = "1.13.1"
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", default-features = false, features = ["json", "native-tls"] }

[dev-dependencies]
tempfile = "3.27.0"
