# Tier 5: live model calls. Only when started by hand; needs the ANTHROPIC_API_KEY secret and
# costs about $0.10 per deed per run (docs/migration.md). Run 1 of each deed is recorded as a
# fixture; the recorded fixtures and summary are uploaded for review, never committed here.
# `s106 eval` fails unless every selected deed completed every requested run; the artifacts are
# uploaded either way.
name: live
on:
  workflow_dispatch:
    inputs:
      runs:
        description: runs per deed
        default: "3"
      only:
        description: comma-separated deed ids (empty for all)
        default: ""
jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: corpus-${{ hashFiles('fixtures/corpus.tsv') }}
      - run: scripts/fetch-models.sh
      # this run is started by hand and is never a pull-request check, so it needs the whole corpus
      - run: scripts/fetch-corpus.sh
      - run: cargo run --release -- eval --runs "$RUNS" ${ONLY:+--only "$ONLY"}
        env:
          RUNS: ${{ inputs.runs }}
          ONLY: ${{ inputs.only }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval
          path: |
            data/processed/eval
            fixtures/llm
