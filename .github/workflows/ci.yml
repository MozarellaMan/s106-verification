# Tiers 1-2 on every push and pull request: unit tests (`cargo test`), then the real corpus's
# page-text snapshots from the private s106-data repository (`cargo test-data`, read
# with the read-only deploy key in the S106_DATA_DEPLOY_KEY secret). No PDFs, runtime artifacts,
# credentials or network at test time.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  # The results explorer is its own workspace, built for the browser; nothing else compiles it
  # before a hand-started Pages deploy.
  explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: explorer
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MozarellaMan/s106-data
          ref: main
          path: data
          ssh-key: ${{ secrets.S106_DATA_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test-data
